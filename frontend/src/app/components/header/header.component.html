<header class="wix-header" [class.open]="menuOpen">
  <div class="inner">
    <a routerLink="/" class="logo" (click)="closeMenu()" aria-label="Zion Travels home">
      <img src="/zion-logo.jpg" alt="Zion Travels" class="logo-mark" />
      <span class="logo-text">Zion Travels</span>
    </a>

    <button class="menu-toggle" type="button" aria-label="Toggle menu" (click)="toggleMenu()">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" [class.show]="menuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      <a href="#services" (click)="closeMenu()">Services</a>
      <!-- <a routerLink="/car-rentals" routerLinkActive="active" (click)="closeMenu()">Cars</a> -->
      <a href="#about" (click)="closeMenu()">About</a>
      <!-- <a routerLink="/admin" routerLinkActive="active" (click)="closeMenu()">Admin</a> -->
      <a class="book-btn" routerLink="/car-rentals" (click)="closeMenu()">Book</a>
    </nav>
  </div>
</header>
